<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absensi WFH - KPU Buton Selatan</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #b91c1c; /* Merah KPU */
      --secondary: #ea580c; /* Oranye */
      --bg-gradient: linear-gradient(135deg, #b91c1c 0%, #ea580c 100%);
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }

    body { 
      font-family: 'Poppins', sans-serif; 
      background: var(--bg-gradient); 
      margin: 0; 
      min-height: 100vh; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      box-sizing: border-box;
      overflow-x: hidden;
    }
    
    /* Dekorasi Background (Blob) */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      opacity: 0.4;
      animation: float 8s ease-in-out infinite;
    }
    .blob-1 { top: -10%; left: -5%; width: 400px; height: 400px; background: #fca5a5; }
    .blob-2 { bottom: -10%; right: -5%; width: 500px; height: 500px; background: #fdba74; animation-delay: 2s; }
    .blob-3 { top: 40%; left: 60%; width: 300px; height: 300px; background: #fff; opacity: 0.2; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-30px) scale(1.05); }
    }

    .card { 
      background: #ffffff; 
      padding: 40px 30px; 
      border-radius: 28px; 
      width: 100%; 
      max-width: 430px; 
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35); 
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
      position: relative; 
      z-index: 10; 
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,0.5);
    }
    @keyframes slideUp { 
      from { opacity: 0; transform: translateY(40px) scale(0.95); } 
      to { opacity: 1; transform: translateY(0) scale(1); } 
    }
    
    .header-icon { 
      text-align: center; 
      margin-bottom: 20px; 
      background: #ffffff; 
      width: 90px; 
      height: 90px; 
      border-radius: 24px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin-left: auto; 
      margin-right: auto; 
      box-shadow: 0 10px 25px rgba(185, 28, 28, 0.25), 0 0 0 8px rgba(255, 255, 255, 0.4);
      transition: transform 0.3s ease;
    }
    .header-icon:hover { transform: rotate(-5deg) scale(1.05); }
    
    h3 { 
      text-align: center; 
      color: var(--primary); 
      font-weight: 800; 
      margin-top: 0; 
      margin-bottom: 5px; 
      font-size: 22px; 
      letter-spacing: -0.5px;
    }
    
    .subtitle { 
      text-align: center; 
      color: var(--text-muted); 
      font-size: 12px; 
      font-weight: 500;
      margin-bottom: 30px; 
      display: block;
      text-wrap: balance; 
      line-height: 1.5;
      padding-bottom: 20px;
      border-bottom: 1px dashed #e2e8f0;
    }
    
    .input-group { margin-bottom: 18px; position: relative; }
    label { 
      display: block; 
      font-size: 13px; 
      font-weight: 600; 
      color: var(--text-main); 
      margin-bottom: 8px; 
      margin-left: 5px; 
    }
    
    .input-wrapper { position: relative; }
    .input-icon { 
      position: absolute; 
      left: 16px; 
      top: 50%; 
      transform: translateY(-50%); 
      color: #94a3b8; 
      pointer-events: none; 
      transition: color 0.3s ease;
    }
    
    input[type="text"], input[type="number"], select { 
      width: 100%; 
      padding: 15px 40px 15px 45px; 
      border: 1.5px solid var(--input-border); 
      border-radius: 14px; 
      font-size: 14px; 
      font-family: 'Poppins', sans-serif; 
      font-weight: 500;
      box-sizing: border-box; 
      background-color: var(--input-bg);
      transition: all 0.3s ease;
      text-overflow: ellipsis; 
      white-space: nowrap;     
      overflow: hidden;        
      color: var(--text-main);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      cursor: pointer;
    }
    .dropdown-arrow {
      position: absolute; 
      right: 18px; 
      top: 50%; 
      transform: translateY(-50%); 
      pointer-events: none; 
      color: #94a3b8;
    }
    
    input:focus, select:focus { 
      border-color: var(--primary); 
      outline: none; 
      background-color: #fff; 
      box-shadow: 0 0 0 4px rgba(185, 28, 28, 0.1); 
    }
    input:focus ~ .input-icon, select:focus ~ .input-icon {
      color: var(--primary);
    }
    
    input[readonly] { 
      background-color: #f1f5f9; 
      color: #64748b; 
      cursor: not-allowed; 
      border-color: #e2e8f0; 
    }
    input[readonly]:focus { box-shadow: none; border-color: #e2e8f0; }

    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    /* File Upload */
    .file-upload-wrapper { position: relative; width: 100%; height: 60px; }
    .file-upload-wrapper input[type="file"] { 
      position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; 
    }
    .custom-file-btn { 
      position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; 
      gap: 10px; background-color: var(--input-bg); border: 1.5px dashed #cbd5e1; border-radius: 14px; color: #64748b; 
      font-weight: 500; font-size: 14px; z-index: 1; transition: all 0.3s ease;
    }
    .file-upload-wrapper input[type="file"]:hover + .custom-file-btn { 
      background-color: #fff1f2; border-color: var(--primary); color: var(--primary); 
    }
    
    button[type="submit"] { 
      width: 100%; 
      padding: 16px; 
      background: var(--bg-gradient); 
      color: white; 
      border: none; 
      border-radius: 14px; 
      font-size: 16px; 
      font-weight: 700; 
      font-family: 'Poppins', sans-serif; 
      cursor: pointer; 
      margin-top: 15px; 
      transition: all 0.3s ease; 
      box-shadow: 0 10px 20px -5px rgba(185, 28, 28, 0.5);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      letter-spacing: 0.5px;
    }
    button[type="submit"]:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 15px 25px -5px rgba(185, 28, 28, 0.6); 
    }
    button[type="submit"]:active { transform: translateY(-1px); }
    button[type="submit"]:disabled { 
      background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; 
    }
    
    .spinner { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); z-index: 9999;
      justify-content: center; align-items: center; animation: fadeBg 0.3s ease;
    }
    .modal-overlay.active { display: flex; }
    @keyframes fadeBg { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: #fff; padding: 35px 30px; border-radius: 24px; width: 90%; max-width: 360px;
      text-align: center; animation: scaleUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
    }
    @keyframes scaleUp { from { transform: scale(0.8) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
    
    .modal-icon { 
      width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px; 
      display: flex; align-items: center; justify-content: center; 
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
    }
    @keyframes popIn { 0% { transform: scale(0); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
    
    .modal-icon.success { background: #d1fae5; color: #059669; box-shadow: 0 0 0 8px rgba(5, 150, 105, 0.1); }
    .modal-icon.error { background: #fee2e2; color: #dc2626; box-shadow: 0 0 0 8px rgba(220, 38, 38, 0.1); }
    
    .modal-box h3 { margin: 0 0 10px; color: var(--text-main); font-size: 22px; font-weight: 700; }
    .modal-box p { margin: 0 0 25px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
    
    .modal-btn { 
      background: var(--bg-gradient); color: #fff; border: none; padding: 14px 30px; 
      border-radius: 12px; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 15px;
      cursor: pointer; width: 100%; transition: 0.3s; 
      box-shadow: 0 5px 15px rgba(185, 28, 28, 0.3);
    }
    .modal-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(185, 28, 28, 0.4); }

    @media (max-width: 480px) {
      .card { padding: 30px 20px; }
      h3 { font-size: 20px; }
      input[type="text"], input[type="number"], select { font-size: 13px; padding: 13px 35px 13px 42px; }
    }
  </style>
</head>
<body>
  <!-- Dekorasi Background -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="card">
    <div class="header-icon">
      <img src="https://www.kpu.go.id/images/1627539868logo-kpu.png" style="width: 60px; height: auto;" alt="Logo KPU" />
    </div>
    <h3>ABSENSI PEGAWAI WFH</h3>
    <span class="subtitle">Komisi Pemilihan Umum Kabupaten Buton Selatan</span>
    
    <form id="formAbsen" onsubmit="kirimData(event)">
      
      <div class="input-group">
        <label>Nama Lengkap</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          </div>
          <input type="text" id="nama" placeholder="Masukkan nama lengkap..." required>
        </div>
      </div>
      
      <div class="input-group">
        <label>NIP</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          </div>
          <input type="number" id="nip" placeholder="Masukkan NIP..." inputmode="numeric" required>
        </div>
      </div>
      
      <div class="input-group">
        <label>Jabatan</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
          </div>
          <select id="jabatan" required>
            <option value="" disabled selected hidden>Pilih jabatan Anda...</option>
            <option value="Sekretaris">Sekretaris</option>
            <option value="Kepala Sub Bagian Keuangan, Umum dan Logistik">Kepala Sub Bagian Keuangan, Umum dan Logistik</option>
            <option value="Kepala Sub Bagian Teknis Penyelenggaraan Pemilu dan Hukum">Kepala Sub Bagian Teknis Penyelenggaraan Pemilu dan Hukum</option>
            <option value="Kepala Sub Bagian Perencanaan, Data dan Informasi">Kepala Sub Bagian Perencanaan, Data dan Informasi</option>
            <option value="Kepala Sub Bagian SDM dan Parmas">Kepala Sub Bagian SDM dan Parmas</option>
            <option value="Arsiparis Ahli Pertama">Arsiparis Ahli Pertama</option>
            <option value="Penata Kelola Pemilu Ahli Pertama">Penata Kelola Pemilu Ahli Pertama</option>
            <option value="Penyusun Materi Hukum dan Perundang-Undangan">Penyusun Materi Hukum dan Perundang-Undangan</option>
            <option value="Penata Kelola Sistem dan Teknologi Informasi">Penata Kelola Sistem dan Teknologi Informasi</option>
            <option value="Pengolah Data dan Informasi">Pengolah Data dan Informasi</option>
            <option value="Pengelola Layanan Operasional">Pengelola Layanan Operasional</option>
            <option value="Pengadministrasi Perkantoran">Pengadministrasi Perkantoran</option>
            <option value="Tenaga Pendukung">Tenaga Pendukung</option>
          </select>
          <div class="dropdown-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
      </div>
      
      <div class="input-group">
        <label>Tanggal</label>
        <div class="input-wrapper">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </div>
          <input type="text" id="tanggal" readonly title="Tanggal dicatat otomatis oleh sistem">
        </div>
      </div>
      
      <div class="input-group">
        <label>Swafoto (Selfie)</label>
        <div class="file-upload-wrapper">
          <input type="file" id="foto" accept="image/*" capture="user" required onchange="ubahTeksFoto(this)">
          <div class="custom-file-btn" id="teks-tombol-foto">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>Ketuk untuk ambil foto</span>
          </div>
        </div>
      </div>
      
      <button type="submit" id="tombol">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="btn-text">Kirim Absensi</span>
      </button>
    </form>
  </div>

  <div class="modal-overlay" id="popupModal">
    <div class="modal-box">
      <div class="modal-icon" id="modalIcon"></div>
      <h3 id="modalTitle">Berhasil!</h3>
      <p id="modalMessage">Data absensi Anda telah berhasil terkirim.</p>
      <button class="modal-btn" onclick="tutupModal()">Tutup</button>
    </div>
  </div>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwckM838Py46Wt08jXiJVusy6qwCVeJUsQwJpFIqY_ehwrU3QO0Pi2G_v3SvgcZG9l9YQ/exec';

    document.addEventListener("DOMContentLoaded", function() {
      var today = new Date();
      var dd = String(today.getDate()).padStart(2, '0');
      var mm = String(today.getMonth() + 1).padStart(2, '0');
      var yyyy = today.getFullYear();
      document.getElementById('tanggal').value = dd + '-' + mm + '-' + yyyy;
    });

    function ubahTeksFoto(input) {
      var teksTombol = document.getElementById('teks-tombol-foto');
      if (input.files && input.files[0]) {
        teksTombol.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg><span style="color:#059669; font-weight:600;">Foto Siap!</span>`;
        teksTombol.style.borderColor = "#059669"; 
        teksTombol.style.backgroundColor = "#ecfdf5";
      } else {
        teksTombol.innerHTML = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg><span>Ketuk untuk ambil foto</span>`;
        teksTombol.style.borderColor = "#cbd5e1"; 
        teksTombol.style.backgroundColor = "#f8fafc";
      }
    }

    function kompresGambar(file, callback) {
      var reader = new FileReader(); reader.readAsDataURL(file);
      reader.onload = function(e) {
        var img = new Image(); img.src = e.target.result;
        img.onload = function() {
          var canvas = document.createElement('canvas'); var ctx = canvas.getContext('2d');
          var maxWidth = 800; var maxHeight = 800; var width = img.width; var height = img.height;
          if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } } 
          else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
          canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', 0.7));
        }
      }
    }

    function tampilkanModal(status, message) {
      var modal = document.getElementById('popupModal');
      var icon = document.getElementById('modalIcon');
      var title = document.getElementById('modalTitle');
      var msg = document.getElementById('modalMessage');

      msg.innerText = message;

      if(status === 'success') {
        icon.className = "modal-icon success";
        icon.innerHTML = '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
        title.innerText = "Absensi Berhasil!";
      } else {
        icon.className = "modal-icon error";
        icon.innerHTML = '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
        title.innerText = "Terjadi Kesalahan";
      }
      modal.classList.add('active');
    }

    function tutupModal() {
      document.getElementById('popupModal').classList.remove('active');
    }

    function kirimData(event) {
      event.preventDefault();
      
      var fileFoto = document.getElementById("foto").files[0];
      if (!fileFoto) {
        tampilkanModal('error', "Silakan unggah swafoto terlebih dahulu!");
        return;
      }

      var tombol = document.getElementById("tombol");
      var btnText = document.getElementById("btn-text");
      var btnIcon = document.getElementById("btn-icon");
      
      tombol.disabled = true; 
      btnText.innerText = "Mengirim Data..."; 
      btnIcon.outerHTML = '<div class="spinner" id="btn-icon"></div>';

      kompresGambar(fileFoto, function(base64) {
        var dataObj = {
          nama: document.getElementById("nama").value,
          nip: document.getElementById("nip").value,
          jabatan: document.getElementById("jabatan").value,
          tanggal: document.getElementById("tanggal").value, 
          fotoBase64: base64
        };

        fetch(scriptURL, { method: 'POST', redirect: 'follow', body: JSON.stringify(dataObj) })
        .then(response => response.json())
        .then(data => {
          if (data.status === "success") {
            tampilkanModal('success', data.message);
            document.getElementById("formAbsen").reset();
            var today = new Date();
            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var yyyy = today.getFullYear();
            document.getElementById('tanggal').value = dd + '-' + mm + '-' + yyyy;
            ubahTeksFoto(document.getElementById("foto")); 
          } else {
            tampilkanModal('error', data.message);
          }
          tombol.disabled = false; 
          btnText.innerText = "Kirim Absensi";
          document.getElementById("btn-icon").outerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
        })
        .catch(error => {
          tampilkanModal('error', "Terjadi kesalahan jaringan, coba lagi.");
          tombol.disabled = false; 
          btnText.innerText = "Kirim Absensi";
          document.getElementById("btn-icon").outerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="btn-icon"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>';
        });
      });
    }
  </script>
</body>
</html>
